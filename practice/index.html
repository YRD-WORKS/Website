<!-- Practice-Seite (Arbeitstitel Corporate), Fotostapel. Seit 08.11.2026 einzige Arbeitsdatei, hier direkt aendern; die fruehere Probe stapel.html und alle anderen Proben liegen in Website/_Archiv/practice-proben-2026-11-08/. DE-Saetze = bestaetigter Einstieg (Corporate-Geruest), EN = Entwurf Claude, ungeprueft. -->
<style>
@font-face{font-family:"ABC Areal";src:url("../Schrift/ABCAreal-Regular.woff2") format("woff2");font-weight:300 499;font-display:swap}
@font-face{font-family:"ABC Areal";src:url("../Schrift/ABCAreal-Medium.woff2") format("woff2");font-weight:500 900;font-display:swap}
:root{
  --bg:#fff; --ink:rgb(0,0,255); --ink-4:rgba(0,0,255,.65); --line:rgba(0,0,255,.3);
  --base:clamp(10px,.88vw,22px); --pad:max(16px,1rem); font-size:var(--base);
  --fb-b:1rem; --fb-h:3.2rem; --fb-in:1.3rem;
  --t-fast:.2s; --t-mid:.35s; --e-out:cubic-bezier(.2,.7,.2,1);
}
@media (max-width:700px){ :root{ --base:10px; font-size:15px; --pad:16px } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font-family:"ABC Areal","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:1.3rem;font-weight:550;line-height:1.22;-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink)!important;outline-offset:3px!important}   /* Review 08.11.: Fokus ueberall gleich (DESIGN.md), auch bei Knoepfen mit all:unset */
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.caption{font-size:1.05rem;font-weight:420}
.n{color:var(--ink-4)}

.nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;padding:var(--pad);pointer-events:none}
.nav a{pointer-events:auto}
.nav .links{display:flex;gap:1em}
/* wie Hauptseite (style.css): Menuepunkte und YRD.Works wackeln beim Hovern einmal leicht, statt unterstrichen zu werden (Ruben 08.11.) */
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-3deg)}45%{transform:rotate(2.2deg)}70%{transform:rotate(-1deg)}}
.nav > a,.nav .links a{display:inline-block;transform-origin:0 50%}
@media (hover:hover) and (pointer:fine){ .nav > a:hover,.nav .links a:hover{animation:wiggle .5s ease-in-out} }
@media (prefers-reduced-motion:reduce){ .nav > a:hover,.nav .links a:hover{animation:none} }
::selection{background:rgb(0,0,255);color:#fff}

/* Raum mit Bodenraster wie auf der 3D-Seite */
#scene{position:fixed;inset:0;perspective:1600px;perspective-origin:50% 36%;overflow:hidden}
#rig{position:absolute;left:50%;top:66%;width:0;height:0;transform-style:preserve-3d;transform:translateZ(-700px) rotateX(-18deg) rotateY(45deg)}
#floor{position:absolute;left:-3500px;top:-3500px;width:7000px;height:7000px;transform:rotateX(90deg);
  background-image:linear-gradient(rgba(0,0,255,.16) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(0,0,255,.16) 1.5px,transparent 1.5px);background-size:80px 80px;
  -webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);mask-image:radial-gradient(closest-side,#000 35%,transparent 100%)}
#stack{position:absolute;left:0;top:0;transform-style:preserve-3d}
html.vorschlag:not(.fitok) #scene{opacity:0}
html.vorschlag #scene{transition:opacity .45s var(--e-out)}   /* Stapel erst zeigen, wenn das Band eingepasst ist, sonst sieht man es nach links rutschen (Ruben 08.11.) */
.card{position:absolute;left:0;top:0;transform-style:preserve-3d}
.card .pic{position:absolute;left:0;bottom:0;transform-origin:50% 100%;transition:transform var(--t-mid) var(--e-out)}
.card img,.card video{display:block;height:var(--h);width:auto;user-select:none;-webkit-user-drag:none;background:rgba(0,0,255,.08)}
.card .sh{position:absolute;left:-8%;bottom:-40px;width:116%;height:80px;transform:translateY(-2px) rotateX(90deg);background:radial-gradient(closest-side,rgba(0,0,60,.3),transparent);pointer-events:none}
html.f32 .card img,html.f32 .card video{width:calc(var(--h) * 1.5);object-fit:cover}
/* Zeiger-Pfeile wie in der Bildstrecke (style.css #nlb): beim Lesen links zurueck, rechts weiter (Ruben 07.11.) */
@media (hover:hover) and (pointer:fine){ html.vorschlag.lesen #scene.c-r,html.vorschlag.lesen #scene.c-r *{cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2232%22%20height%3D%2232%22%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2214.5%22%20fill%3D%22%23fff%22%20stroke%3D%22%2300f%22%20stroke-width%3D%221.5%22/%3E%3Cpath%20d%3D%22M11%2016h10M17%2011.5l4.5%204.5-4.5%204.5%22%20fill%3D%22none%22%20stroke%3D%22%2300f%22%20stroke-width%3D%221.5%22/%3E%3C/svg%3E") 16 16, e-resize} html.vorschlag.lesen #scene.c-r .card:not(.on):not(.nah),html.vorschlag.lesen #scene.c-r .card:not(.on):not(.nah) *,html.vorschlag.lesen #scene.c-l .card:not(.on):not(.nah),html.vorschlag.lesen #scene.c-l .card:not(.on):not(.nah) *{cursor:pointer !important}   /* andere Bilder: Hand, Klick springt hin */
  html.vorschlag.lesen #scene.c-l,html.vorschlag.lesen #scene.c-l *{cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2232%22%20height%3D%2232%22%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2214.5%22%20fill%3D%22%23fff%22%20stroke%3D%22%2300f%22%20stroke-width%3D%221.5%22/%3E%3Cpath%20d%3D%22M21%2016H11M15%2011.5L10.5%2016l4.5%204.5%22%20fill%3D%22none%22%20stroke%3D%22%2300f%22%20stroke-width%3D%221.5%22/%3E%3C/svg%3E") 16 16, w-resize} }
/* Intro wie auf der Startseite (style.css #intro, Ruben 08.11.): Woerter nacheinander, waehrend Bilder und Filme laden */
#intro{position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .6s cubic-bezier(.5,0,.75,0),visibility 0s linear .6s}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}
#intro-w{font-size:clamp(1.6rem,3.6vw,4.5rem);font-weight:550;line-height:1;letter-spacing:-.01em;text-align:center;white-space:nowrap}
html.intro-on,html.intro-on body{overflow:hidden}
@media (prefers-reduced-motion:reduce){ #intro{transition:none} }
.nav .links a[aria-current]{text-decoration:underline;text-underline-offset:.18em;text-decoration-thickness:1px}
.mmb,.mml{display:none}
@media (max-width:700px){
  /* Handy: Menue wie auf der Website statt der Linkzeile */
  .nav .links{display:none}
  .mmb{display:block;pointer-events:auto;font:inherit;color:var(--ink);background:none;border:0;padding:0;cursor:pointer}
  .mml:not([hidden]){display:flex;flex-direction:column;gap:.5em;position:fixed;top:3.2rem;right:var(--pad);z-index:20;background:var(--bg);padding:.8em 1em;box-shadow:inset 0 0 0 1px var(--ink);border-radius:1em}
  .fbar .l .pill{white-space:nowrap}
  html.vorschlag #scene{touch-action:none}
  html.vorschlag .say{width:auto}
  html.vorschlag #en .num{display:none}
  html.vorschlag .say .s{font-size:14px;line-height:1.3}
  html.vorschlag .fbar .r .pill{display:none}
  html.vorschlag .fdots button{padding:.35em .16em}
  html.vorschlag .fdots i{width:7px;height:7px}
}
.card .pic .sl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s var(--e-out)}
.card .pic .sl.cur{opacity:1}
.card .vtag{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:420;line-height:1;padding:.3em .55em .25em;border-radius:10em;background:rgba(255,255,255,.9);color:var(--ink)}
.card.on .pic{transform:translateY(-20px) scale(1.1)}
.card{cursor:pointer}
.card.on{cursor:default}
@media (hover:hover){ .card:not(.on):hover .pic{transform:translateY(-8px)} }
.card .pic{transition:transform .5s var(--e-out)}

/* Text: DE oben links, EN unten rechts */
.say{position:fixed;z-index:9;width:min(38rem,46vw);background:rgba(255,255,255,.95);padding:.5rem .7rem;margin:-.5rem -.7rem;pointer-events:none;transition:opacity var(--t-mid) var(--e-out),transform var(--t-mid) var(--e-out)}
.say.out{opacity:0}
#de{left:var(--pad);top:4.2rem}
#de.out{transform:translateY(-8px)}
#en{right:var(--pad);bottom:calc(var(--fb-b) + var(--fb-h) + 1.4rem)}
#en.out{transform:translateY(8px)}
.say .s{display:block;font-size:clamp(1.6rem,2.6vw,3.2rem);line-height:1.05}
.say .c{display:block;margin-top:.7rem}
@media (max-width:700px){ .say{width:auto;right:var(--pad);left:var(--pad)} .say .s{font-size:1.5rem} #de{top:3.2rem} }
/* ?unten: beide Texte unten nebeneinander, kleiner (Kapiteltitel-Groesse); ?ohneraster: Boden ohne Raster (Ruben 07.11.) */
html.unten .say{top:auto;bottom:calc(var(--fb-b) + var(--fb-h) + 1.4rem);width:min(30rem,40vw)}
html.unten #de{left:var(--pad);right:auto;top:auto;bottom:calc(var(--fb-b) + var(--fb-h) + 1.4rem)}
html.unten #en{right:var(--pad);left:auto}
html.unten .say .s{font-size:1.9rem;line-height:1.1}
html.unten #de.out{transform:translateY(8px)}
@media (max-width:700px){ html.unten .say{width:auto} html.unten #de{bottom:calc(var(--fb-b) + var(--fb-h) + 7rem)} html.unten .say .s{font-size:1.2rem} }
html.ohneraster #floor{background:none}
/* Iso-Ueberblick: 3D-Boden aus (Chrome zeichnete ihn auf der Grafikkarte ueber das Verzeichnis, Test 08.11.: Link A), stattdessen flaches Raster im Isometrie-Winkel */
html.isov #floor{display:none}
#isogrid{display:none}
html.isov #isogrid{display:block;position:fixed;inset:0;pointer-events:none;background-image:repeating-linear-gradient(var(--bandw,30deg),rgba(0,0,255,.1) 0 1px,transparent 1px 46px),repeating-linear-gradient(var(--kantew,150deg),rgba(0,0,255,.1) 0 1px,transparent 1px 46px);-webkit-mask-image:radial-gradient(ellipse 48% 52% at 64% 54%,#000 30%,transparent 100%);mask-image:radial-gradient(ellipse 48% 52% at 64% 54%,#000 30%,transparent 100%);transition:opacity 1.2s var(--e-out)}
html.isov.lesen #isogrid{opacity:0}
html.isov.nosp #isogrid{-webkit-mask-position:-28vw 0;mask-position:-28vw 0}
/* Iso-Ueberblick: Boden kleiner, damit er ganz vor der Kamera bleibt (sonst zeichnet Chrome auf der Grafikkarte Teile ueber das Verzeichnis); Rasterweite gleich */

/* ?vorschlag: Raster nur im Ueberblick, beim Lesen blendet es aus; EN als zweite Stimme heller; Bildunterschrift einmal in der Leiste; Hinweis zum Start */
html.vorschlag #floor{transition:opacity 1.4s var(--e-out)}
html.vorschlag.lesen #floor{opacity:0}
/* Setzung wie in der 2D-Projektansicht (style.css .proj-bi): DE voll, EN kursiv und blass, Hover ueber EN tauscht die beiden (Ruben 07.11.) */
html.vorschlag .say .s{text-wrap:pretty;-webkit-hyphens:auto;hyphens:auto;hyphenate-limit-chars:10 5 5;overflow-wrap:break-word;transition:color var(--t-fast) var(--e-out)}
html.vorschlag #en .s{font-style:italic;color:var(--ink)}
@media (hover:hover) and (pointer:fine){
  html.vorschlag #en .s{color:var(--ink-4)}   /* Review 08.11.: 65 % statt 30 % Deckkraft (Kontrast 4,9 statt 1,9 : 1) */
  html.vorschlag:has(#en:hover) #en .s{color:var(--ink)}
  html.vorschlag:has(#en:hover) #de .s{color:var(--ink-4)}
  html.vorschlag.lesen .say{pointer-events:auto}
}
html.vorschlag .say .c{display:none}
html.vorschlag .card{transition:opacity .8s var(--e-out)}
@keyframes einblenden{from{opacity:0}}
.card.pop{animation:einblenden .9s var(--e-out)}
#hint{display:none}
.say .num{display:none}
/* Vorschlag: Texte in Lesegroesse, mittig zu beiden Seiten der Mittelachse, dezent nummeriert (Ruben 07.11.) */
html.vorschlag .say{width:min(31rem,42vw);background:none;padding:0;margin:0}
html.vorschlag #de{left:auto;right:calc(50% + 1rem)}
html.vorschlag #en{right:auto;left:calc(50% + 1rem)}
html.vorschlag .say .s{font-size:1.3rem;line-height:1.22}   /* Review 08.11.: Fliesstext-Stufe aus DESIGN.md, vorher 1.1rem und damit kleiner als das Menue */
html.vorschlag #en .num{visibility:hidden}   /* Nummer nur einmal, ueber dem deutschen Text */
html.vorschlag .say .num{display:block;color:var(--ink-4);margin-bottom:.35rem;font-variant-numeric:tabular-nums}
html.vorschlag p#hint{display:none}
html.vorschlag:not(.lesen) .say{opacity:0;pointer-events:none}   /* Texte erst nach dem ersten Aufklappen */   /* Hinweis steht im Ueberblick jetzt rechts in der Leiste */
@media (max-width:700px){ html.vorschlag .say{width:auto} html.vorschlag #de{left:var(--pad);right:var(--pad)} html.vorschlag #en{left:var(--pad);right:var(--pad)} }
#ring{display:none;position:absolute;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(0,0,255,.35);transform:rotateX(90deg);pointer-events:none;transition:opacity 1.4s var(--e-out)}
html.kreis #ring{display:block}
html.kreis .card:not(.on) .sh,html.vorschlag .card:not(.on) .sh{opacity:0}
html.vorschlag .card .sh{display:none}   /* Vorschlag ohne Bodenschatten: auf Augenhoehe und ohne Raster gibt es keinen Boden, auf dem er liegen koennte (Ruben 07.11.) */
html.kreis.lesen #ring{opacity:.35}
html.vorschlag #hint{display:block;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--fb-b) + var(--fb-h) + 1.4rem);z-index:9;color:var(--ink-4);text-align:center;pointer-events:none;transition:opacity .6s}
html.vorschlag.lesen #hint{opacity:0}
@media (max-width:700px){ html.vorschlag #hint{display:none} }

/* Leiste */
.fbar{position:fixed;left:var(--pad);right:var(--pad);bottom:calc(var(--fb-b) + env(safe-area-inset-bottom,0px));height:var(--fb-h);z-index:12;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 var(--fb-in);border-radius:10em;background:var(--bg);box-shadow:inset 0 0 0 1px var(--ink)}
.fbar .l{justify-self:start}.fbar .c{justify-self:center;display:flex;gap:.6em}.fbar .r{justify-self:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;line-height:1;padding:.3em .8em .26em;border-radius:10em;box-shadow:inset 0 0 0 1px var(--ink);background:var(--bg);color:var(--ink);transform-origin:50% 50%;transition:background var(--t-fast) var(--e-out),color var(--t-fast) var(--e-out)}
@media (hover:hover) and (pointer:fine){ .pill:hover{background:rgba(0,0,255,.08);animation:wiggle .5s ease-in-out} }   /* wie die Pillen in der Leiste der 3D-Ansicht */
@media (prefers-reduced-motion:reduce){ .pill:hover{animation:none} }
.fbar .r{display:flex;align-items:center;gap:.6em}
/* Overview / Walk wie auf der 3D-Seite (Ruben 08.11.): Pille mit Umriss, gewaehlt blau mit weisser Schrift; Overview = isometrischer Ueberblick, Walk = Tafeln aufgeklappt */
#navmode .seg{display:inline-flex;align-items:center;gap:.35em;line-height:1}   /* wie 3D (style.css 30.10.): einzelne Pillen, dazwischen ein schmaler Pfeil, gewaehlt blau gefuellt */
#navmode button{all:unset;cursor:pointer;display:block;text-align:center;padding:.3em .8em .26em;border-radius:10em;box-shadow:inset 0 0 0 1px var(--ink);background:var(--bg);color:var(--ink);line-height:1;transition:background .2s ease,color .2s ease}
#navmode button[aria-pressed="true"]{background:var(--ink);color:var(--bg);cursor:default}
@media (hover:hover) and (pointer:fine){ #navmode button:not([aria-pressed="true"]):hover{background:rgba(0,0,255,.08)} }
#navmode .sep{color:var(--ink);line-height:1;opacity:.6;pointer-events:none}
/* Themenpunkte wie im Gang (practice/index.html) */
.fdots{display:inline-flex;align-items:center;gap:.2em}
.fdots button{appearance:none;border:0;background:none;padding:.35em .3em;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fdots i{display:block;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--ink);background:transparent;transition:background .3s,transform .3s,box-shadow .3s}
.fdots button.seen i{background:var(--ink)}
.fdots button.cur i{background:var(--ink);transform:scale(1.45);box-shadow:inset 0 0 0 1px var(--ink),0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
@media (hover:hover) and (pointer:fine){ .fdots button:hover i{background:rgba(0,0,255,.35)} .fdots button.seen:hover i,.fdots button.cur:hover i{background:var(--ink)} }
@media (max-width:700px){ .fbar{font-size:13px} .fbar .lg,#cnt{display:none} .fbar .r .pill{padding:.3em .6em .26em} }
/* Leistungsebene (08.11., nach Julias Rueckmeldung, aus probe-leistung.html uebernommen): Liste im Ueberblick, Leistungszeile je Tafel, Zusammenarbeit in der Leiste */
#lst{position:fixed;z-index:9;right:var(--pad);bottom:calc(var(--fb-b) + var(--fb-h) + 1.2rem);}
html:not(.nosp) #lst{right:auto;bottom:auto;left:var(--pad);top:5.5rem;translate:none;margin-right:0;margin-left:-.8rem;padding-top:0}   /* oben unter der Kopfzeile; Textfeld #vor nimmt dieselbe Oberkante (Ruben 08.11.) */
#lst{width:min(30rem,36vw);background:none;padding:.6rem .8rem .8rem;margin-right:-.8rem;pointer-events:none;transition:opacity .6s var(--e-out),transform .6s var(--e-out)}
html.vorschlag.lesen:not(.angekommen) .say{opacity:0!important;transition:none}
html.lesen #lst,html.vorschlag:not(.ovda) #lst{opacity:0;transform:translateY(-8px);pointer-events:none}
html.vorschlag:not(.ovda) #lst button{pointer-events:none}
#lst .k{color:var(--ink-4);margin:0 0 .8rem}
#lst .satz{margin:0 0 .9rem;font-size:1.08rem;line-height:1.25;max-width:26rem}
#lst .g{color:var(--ink);font-size:1.08rem;line-height:1.2;font-weight:550;margin:1rem 0 .3rem}
#lst .g .gn{display:inline-block;width:2em;color:var(--ink-4);font-weight:400}
#lst ol{padding-left:0!important}
#lst li.ab{margin-top:.55rem}
html.pillen #lst ol{font-size:1.15rem;display:flex;flex-direction:column;align-items:flex-start;gap:.35rem}
html.pillen #lst li.ab{margin-top:.5rem}
html.pillen #lst button{padding:.28em .8em .24em .55em;border-radius:10em;box-shadow:inset 0 0 0 1px var(--ink);background:var(--bg);line-height:1.1}
html.pillen #lst button .n{width:auto;margin-right:.55em}
html.pillen #lst button.aktiv,html.pillen #lst button:hover,html.pillen #lst button:focus-visible{text-decoration:none;background:var(--ink);color:var(--bg)}
html.pillen #lst button.aktiv .n,html.pillen #lst button:hover .n,html.pillen #lst button:focus-visible .n{color:rgba(255,255,255,.7)}
html.pillen #lst .g{font-size:1.15rem;margin:1.2rem 0 .5rem}
html.pillen #lst{width:min(34rem,40vw)}   /* Was wir machen: Orte (01-04) und Raeume (05-10) durch Abstand getrennt */   /* Eintraege unter dem Kapiteltitel eingerueckt (Ruben 08.11.) */
#lst ol{list-style:none;margin:0;padding:0;font-size:1.08rem;line-height:1.2}
#lst button{all:unset;cursor:pointer;display:block;padding:.13em 0;pointer-events:auto;color:var(--ink);white-space:nowrap}
#lst button .n{display:inline-block;width:2em;color:var(--ink-4);font-variant-numeric:tabular-nums}
#lst button .e{margin-left:.6em;color:var(--ink-4);font-style:italic;font-size:.8em;opacity:0;transition:opacity var(--t-fast)}
#lst button .e{display:none}
#lst button:hover,#lst button:focus-visible{text-decoration:underline;text-underline-offset:.18em}
#stack.toc .card:not(.on):not(.grp) .pic{opacity:.35}
/* Iso-Ueberblick: gewaehltes Bild gleitet in seiner Ebene nach oben aus dem Stapel (Karteikarte) */

const S=[
 ["Leerstehende Gebäude und Zwischennutzungen ziehen sich seit den Anfängen durch unsere Arbeit. Wir zeigen das Potenzial ungenutzter Orte und entwickeln authentische Antworten auf Strukturwandel und sich verändernde Innenstädte.",
  "Vacant buildings and temporary uses have run through our work since the beginning. We reveal the potential of unused places and develop authentic answers to structural change and changing city centres."],
 ["Im öffentlichen Raum setzen wir auf bildstarke Gesten, die auffallen und trotzdem einladen. Unsere Interventionen beziehen die Menschen vor Ort ein und schaffen für sie einen Mehrwert, der über das Bild hinausgeht.",
  "In public space we rely on strong visual gestures that stand out and still invite people in. Our interventions involve the people on site and create value for them that goes beyond the image."],
 ["Wir machen den öffentlichen Stadtraum zur Bühne. Temporäre Architektur kann einen Ort im Umbruch begleiten oder auf Bedürfnisse hinweisen. Ein bildstarkes Projekt auf Zeit ist oft das beste Argument für eine Verstetigung.",
  "We turn public urban space into a stage. Temporary architecture can accompany a place in transition or point to needs. A visually striking project for a limited time is often the best argument for making it permanent."],
 ["Wir arbeiten auch im ländlichen Raum, oft dort, wo es wenige Kulturangebote gibt. Gemeinsam mit den Menschen vor Ort schaffen wir Anlässe, zusammenzukommen und einen vertrauten Ort neu zu erleben.",
  "We also work in rural areas, often where there is little cultural provision. Together with local people, we create occasions to come together and experience a familiar place anew."],
 ["Wir entwickeln immersive Ausstellungsarchitekturen, die selbst als künstlerische Position gelesen werden können. Freie Projekte und angewandte Auftragsarbeiten gehen in unserer Praxis ineinander über.",
  "We develop immersive exhibition architectures that can themselves be read as an artistic position. In our practice, independent projects and commissioned work merge into one another."],
 ["Wir entwerfen Räume für Wissensvermittlung und außerschulisches Lernen, über Ziel- und Altersgruppen hinweg. Gemeinsam mit Pädagog*innen übersetzen wir ihre Konzepte in Räume, in denen Wissen und Forschung real erlebbar werden.",
  "We design spaces for knowledge transfer and learning outside school, across target and age groups. Together with educators, we translate their concepts into spaces in which knowledge and research can be experienced first-hand."],
 ["Wir befragen die Räume, in denen wir arbeiten, und kehren ihre Logik um. Es entstehen Hybride aus Skulptur, Architektur und Installation, die im Wortsinn begehbar sind und so die Schwelle zum Kunstbetrieb senken.",
  "We question the spaces we work in and reverse their logic. The results are hybrids of sculpture, architecture and installation that can literally be walked into, lowering the threshold to the art world."],
 ["Unsere Arbeiten werden oft zu Bühnen und Displays für andere. Unsere Skulpturen dienen als Plattform für Musik, Performance und zeitgenössische Kunst und treten dabei bewusst in den Hintergrund.",
  "Our works often become stages and displays for others. Our sculptures serve as platforms for music, performance and contemporary art and deliberately step into the background."],
 ["Wir beschränken uns nicht auf konventionelle Räume und befragen gern die Grenzen unseres Genres. Was ein Projekt braucht, eignen wir uns an, vom selbstgebauten Floß für Bootstouren bis zum temporären Pizzalieferdienst.",
  "We do not limit ourselves to conventional spaces and like to question the boundaries of our genre. We acquire whatever a project needs, from a self-built raft for boat tours to a temporary pizza delivery service."],
 ["Seit 2012 schaffen wir sogenannte Dritte Orte jenseits von Zuhause und Arbeit, die sich Communities aneignen. Viele davon bauen und bespielen wir über Jahre selbst, und sie wirken nach, auch wenn es sie nicht mehr gibt.",
  "Since 2012 we have been creating so-called third places beyond home and work that communities make their own. We build and run many of them ourselves for years, and they continue to have an effect even after they are gone."],
 ["Die Herausforderungen eines Bestands nehmen wir gerne als Ausgangspunkt für den Entwurf. Niedrige Decken, alte Balken oder wenig Tageslicht kaschieren wir nicht, wir machen sie zum Teil der Arbeit.",
  "We take the challenges of an existing building as the starting point for our design. Low ceilings, old beams or little daylight are not concealed; we make them part of the work."],
 ["Wir entwickeln partizipative und soziale Projekte, die Menschen und Communities aktiv einbeziehen. Gesellschaftliche Themen, Selbstwirksamkeit und Teilhabe werden dabei zur gelebten Situation, nicht zur illustrierten Botschaft.",
  "We develop participatory and social projects that actively involve people and communities. Social issues, self-efficacy and participation become a lived situation rather than an illustrated message."],
 ["Unsere Projekte beginnen mit einem Konzept, das Raum, Nutzung und Wirkung zusammendenkt. 3D-Modelle und Pläne sind unsere Werkzeuge, um diese Idee auszuarbeiten und mit allen Beteiligten abzustimmen.",
  "Our projects begin with a concept that brings space, use and effect together. 3D models and plans are our tools for developing this idea and coordinating it with everyone involved."],
 ["Große Projekte begleiten wir von der ersten Idee bis zur fertigen Umsetzung. Mit unserer Erfahrung von zahlreichen Projektbaustellen, auf denen wir selbst gebaut haben, kennen wir Material, Konstruktion und Aufwand und halten, was wir zusagen.",
  "We take large projects from the first idea through to completion. With experience from many building sites where we did the construction ourselves, we know materials, construction and effort, and we deliver what we promise."],
 ["Für große Projekte stellen wir das passende Team zusammen, oft mit Partnern für Fachplanung, Statik und Produktion. Wir übernehmen die Projektsteuerung, stimmen uns mit Behörden ab und behalten Budget und Ablauf im Blick.",
  "For large projects we put together the right team, often with partners for specialist planning, structural engineering and production. We take on project management, coordinate with the authorities and keep budget and schedule in view."]

];

  cards().forEach(function(c,k){ c.addEventListener("mouseenter",function(){ if(!document.documentElement.classList.contains("lesen")){ zeig(k); c.classList.add("zieh"); var b=document.querySelector("#lst button[data-k=\""+k+"\"]"); if(b) b.classList.add("aktiv"); } }); c.addEventListener("mouseleave",function(){ zeig(-1); c.classList.remove("zieh"); var b=document.querySelector("#lst button[data-k=\""+k+"\"]"); if(b) b.classList.remove("aktiv"); }); });   /* Hover ueber ein Bild faerbt auch die passende Pille (Ruben 08.11.: in beide Richtungen) */
  document.querySelectorAll("#lst li > button").forEach(function(b){
    var k=+b.dataset.k;
    function on(v){ if(document.documentElement.classList.contains("lesen")){ zeig(-1); return; }   /* im Walk nichts umsetzen: sonst nimmt das Verlassen der ausgeblendeten Liste dem gewaehlten Bild die Markierung (Fund 09.11.) */ var c=cards()[k]; if(c) c.classList.toggle("on",v); zeig(v?k:-1); }   /* kein Abblassen mehr, das Bild wird herausgezogen (Ruben 08.11.) */
    var hv=KL?b.parentNode:b;   /* Probe Klapptext: Hover gilt fuer Pille und Text zusammen */
    hv.addEventListener("mouseenter",function(){ on(true); });
    hv.addEventListener("mouseleave",function(){ on(false); });
    b.addEventListener("focus",function(){ on(true); });
    b.addEventListener("blur",function(){ on(false); });
    b.addEventListener("click",function(e){ if(KL==="schieben"){ e.stopPropagation(); klappAuf(b.parentNode.classList.contains("auf")?-1:k); return; } e.stopPropagation(); on(false); var d=document.querySelectorAll("#fdots button")[k]; if(d) d.click(); });
  });
})();
</script>
<script>
/* Handy (Ruben 08.11.): Pille Inhalt in der Leiste oeffnet und schliesst das Verzeichnis als Liste; Tippen auf eine Pille oeffnet die Tafel im Walk und schliesst die Liste, Tippen daneben oder Esc schliesst sie */
(function(){
  var b=document.getElementById("inhb"), h=document.documentElement, l=document.getElementById("lst");
  function set(o){ h.classList.toggle("inh",o); b.setAttribute("aria-expanded",String(o)); b.classList.toggle("an",o); }
  b.addEventListener("click",function(e){ e.stopPropagation(); set(!h.classList.contains("inh")); });
  l.addEventListener("click",function(e){ if(h.classList.contains("inh")&&!e.target.closest("button")) set(false); });
  l.querySelectorAll("li > button").forEach(function(x){ x.addEventListener("click",function(){ set(false); }); });
  addEventListener("keydown",function(e){ if(e.key==="Escape") set(false); });
  addEventListener("resize",function(){ if(innerWidth>700) set(false); });
})();
</script>
<script>
/* Gruppen im Verzeichnis: Hover zeigt die Bilder der Gruppe voll, die uebrigen blass (Ruben 08.11.) */
(function(){
  var st=document.getElementById("stack");
  document.querySelectorAll("#lst .g").forEach(function(g){
    var ol=g.nextElementSibling, ks=ol?[].map.call(ol.querySelectorAll("button"),function(b){ return +b.dataset.k; }):[];
    function on(v){ var cs=st.querySelectorAll(".card"); ks.forEach(function(k){ if(cs[k]) cs[k].classList.toggle("grp",v); }); st.classList.toggle("toc",v); }
    g.addEventListener("mouseenter",function(){ on(true); });
    g.addEventListener("mouseleave",function(){ on(false); });
  });
})();
</script>
