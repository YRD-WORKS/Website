<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>YRD.Works – Stapel, Varianten</title>
<!-- Probe 07.11.2026: Vergleich der Stapel-Varianten (corporate/stapel.html mit Adresszusatz) -->
<style>
@font-face{font-family:"ABC Areal";src:url("../Schrift/ABCAreal-Regular.woff2") format("woff2");font-weight:300 499;font-display:swap}
@font-face{font-family:"ABC Areal";src:url("../Schrift/ABCAreal-Medium.woff2") format("woff2");font-weight:500 900;font-display:swap}
:root{--bg:#fff;--ink:rgb(0,0,255);--ink-4:rgba(0,0,255,.65);--base:clamp(10px,.88vw,22px);font-size:var(--base)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font-family:"ABC Areal","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:1.05rem;font-weight:420;line-height:1.22}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
.sw{position:fixed;top:3.4rem;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:.7em;
  padding:.45em .55em .45em 1em;border-radius:10em;background:var(--bg);box-shadow:inset 0 0 0 1px var(--ink);white-space:nowrap;max-width:calc(100vw - 32px)}
.sw .t{font-weight:550}
.sw .d{color:var(--ink-4);overflow:hidden;text-overflow:ellipsis}
.sw .n{font-variant-numeric:tabular-nums;color:var(--ink-4)}
.sw button{font:inherit;color:var(--ink);background:var(--bg);border:0;box-shadow:inset 0 0 0 1px var(--ink);border-radius:10em;padding:.3em .8em .26em;line-height:1;cursor:pointer}
.sw button:hover{background:rgba(0,0,255,.08)}
.sw button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (max-width:700px){ .sw .d{display:none} .sw{top:3rem} }
</style>
</head>
<body>
<iframe id="f" title="Stapel-Variante"></iframe>
<div class="sw" role="group" aria-label="Varianten">
  <button type="button" id="prev" aria-label="Vorige Variante">←</button>
  <span class="n" id="n"></span>
  <span class="t" id="t"></span>
  <span class="d" id="d"></span>
  <button type="button" id="next" aria-label="Nächste Variante">→</button>
</div>
<script>
const V=[
 {k:'vorschlag', q:'?vorschlag', t:'Vorschlag', d:'Überblick mit Raster, Lesen auf Augenhöhe ohne Raster, Texte klein unten, endlos'},
 {k:'kreis', q:'?kreis', t:'Kreis', d:'Ring von außen, Gegenstück zum 3D-Walk: Bilder radial, das gewählte dreht nach außen'},
 {k:'standard', q:'',            t:'Standard',  d:'Raster 45 Grad, Bild dreht 90 Grad an die Querlinien'},
 {k:'schwenk',  q:'?schwenk',    t:'Schwenk, Augenhöhe', d:'Überblick 45 Grad, beim Aufklappen auf 0 Grad, Kamera ohne Neigung'},
 {k:'schwenk-unten', q:'?schwenk&unten&ohneraster', t:'Schwenk, Texte unten', d:'Augenhöhe, beide Texte klein unten, ohne Raster'},
 {k:'schwenk8', q:'?schwenk&tilt=-8',  t:'Schwenk, leicht von oben', d:'wie davor, Kamera 8 Grad geneigt, Raster wieder sichtbar'},
 {k:'schwenk18',q:'?schwenk&tilt=-18&auge=34', t:'Schwenk, Aufsicht', d:'wie vorher, Kamera 18 Grad geneigt'},
 {k:'raster0',  q:'?raster=0',   t:'0 Grad',    d:'Raster gerade, aufgeklapptes Bild frontal'},
 {k:'raster20', q:'?raster=20',  t:'20 Grad',   d:'Raster leicht gedreht, Bild fast frontal'},
 {k:'mix',      q:'?mix',        t:'Mischform', d:'Raster 45 Grad, Bild dreht nur 45 Grad und steht frontal'},
 {k:'iso',      q:'?iso',        t:'Isometrie', d:'ohne Perspektive, 35,26 Grad Aufsicht'}
];
const f=document.getElementById('f');
let i=Math.max(0,V.findIndex(v=>v.k===location.hash.slice(1)));
function show(){
  const v=V[i]; f.src='stapel.html'+v.q;
  document.getElementById('n').textContent=(i+1)+' / '+V.length;
  document.getElementById('t').textContent=v.t;
  document.getElementById('d').textContent=v.d;
  history.replaceState(null,'','#'+v.k);
  f.onload=()=>{ try{ f.contentWindow.focus(); }catch(e){} };   // Pfeiltasten gehen danach an den Stapel
}
document.getElementById('prev').onclick=()=>{ i=(i-1+V.length)%V.length; show(); };
document.getElementById('next').onclick=()=>{ i=(i+1)%V.length; show(); };
show();
</script>
</body>
</html>
