<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>YRD.Works – Corporate (Probe Stapel)</title>
<!-- Probe 07.11.2026: Landing der Corporate-Seite als Fotostapel. DE-Saetze = bestaetigter Einstieg (Corporate-Geruest), EN = Entwurf Claude, ungeprueft. -->
<style>
@font-face{font-family:"ABC Areal";src:url("../Schrift/ABCAreal-Regular.woff2") format("woff2");font-weight:300 499;font-display:swap}
@font-face{font-family:"ABC Areal";src:url("../Schrift/ABCAreal-Medium.woff2") format("woff2");font-weight:500 900;font-display:swap}
:root{
  --bg:#fff; --ink:rgb(0,0,255); --ink-4:rgba(0,0,255,.65); --line:rgba(0,0,255,.3);
  --base:clamp(10px,.88vw,22px); --pad:max(16px,1rem); font-size:var(--base);
  --fb-b:1rem; --fb-h:3.2rem; --fb-in:1.3rem;
  --t-fast:.2s; --t-mid:.35s; --e-out:cubic-bezier(.2,.7,.2,1);
}
@media (max-width:700px){ :root{ --base:10px; font-size:15px; --pad:16px } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font-family:"ABC Areal","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:1.3rem;font-weight:550;line-height:1.22;-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.caption{font-size:1.05rem;font-weight:420}
.n{color:var(--ink-4)}

.nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;padding:var(--pad);pointer-events:none}
.nav a{pointer-events:auto}
.nav .links{display:flex;gap:1em}
@media (hover:hover){ .nav a:hover{text-decoration:underline;text-underline-offset:.18em} }

/* Raum mit Bodenraster wie auf der 3D-Seite */
#scene{position:fixed;inset:0;perspective:1600px;perspective-origin:50% 36%;overflow:hidden}
#rig{position:absolute;left:50%;top:66%;width:0;height:0;transform-style:preserve-3d;transform:translateZ(-700px) rotateX(-18deg) rotateY(45deg)}
#floor{position:absolute;left:-3500px;top:-3500px;width:7000px;height:7000px;transform:rotateX(90deg);
  background-image:linear-gradient(rgba(0,0,255,.16) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(0,0,255,.16) 1.5px,transparent 1.5px);background-size:80px 80px;
  -webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);mask-image:radial-gradient(closest-side,#000 35%,transparent 100%)}
#stack{position:absolute;left:0;top:0;transform-style:preserve-3d}
.card{position:absolute;left:0;top:0;transform-style:preserve-3d}
.card .pic{position:absolute;left:0;bottom:0;transform-origin:50% 100%;transition:transform var(--t-mid) var(--e-out)}
.card img,.card video{display:block;height:var(--h);width:auto;user-select:none;-webkit-user-drag:none;background:rgba(0,0,255,.08)}
.card .sh{position:absolute;left:-8%;bottom:-40px;width:116%;height:80px;transform:translateY(-2px) rotateX(90deg);background:radial-gradient(closest-side,rgba(0,0,60,.3),transparent);pointer-events:none}
.card .pic .sl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s var(--e-out)}
.card .pic .sl.cur{opacity:1}
.card .vtag{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:420;line-height:1;padding:.3em .55em .25em;border-radius:10em;background:rgba(255,255,255,.9);color:var(--ink)}
.card.on .pic{transform:translateY(-20px) scale(1.1)}
.card{cursor:pointer}
.card.on{cursor:default}
@media (hover:hover){ .card:not(.on):hover .pic{transform:translateY(-8px)} }
.card .pic{transition:transform .5s var(--e-out)}

/* Text: DE oben links, EN unten rechts */
.say{position:fixed;z-index:9;width:min(38rem,46vw);background:rgba(255,255,255,.95);padding:.5rem .7rem;margin:-.5rem -.7rem;pointer-events:none;transition:opacity var(--t-mid) var(--e-out),transform var(--t-mid) var(--e-out)}
.say.out{opacity:0}
#de{left:var(--pad);top:4.2rem}
#de.out{transform:translateY(-8px)}
#en{right:var(--pad);bottom:calc(var(--fb-b) + var(--fb-h) + 1.4rem)}
#en.out{transform:translateY(8px)}
.say .s{display:block;font-size:clamp(1.6rem,2.6vw,3.2rem);line-height:1.05}
.say .c{display:block;margin-top:.7rem}
@media (max-width:700px){ .say{width:auto;right:var(--pad);left:var(--pad)} .say .s{font-size:1.5rem} #de{top:3.2rem} }
/* ?unten: beide Texte unten nebeneinander, kleiner (Kapiteltitel-Groesse); ?ohneraster: Boden ohne Raster (Ruben 07.11.) */
html.unten .say{top:auto;bottom:calc(var(--fb-b) + var(--fb-h) + 1.4rem);width:min(30rem,40vw)}
html.unten #de{left:var(--pad);right:auto;top:auto;bottom:calc(var(--fb-b) + var(--fb-h) + 1.4rem)}
html.unten #en{right:var(--pad);left:auto}
html.unten .say .s{font-size:1.9rem;line-height:1.1}
html.unten #de.out{transform:translateY(8px)}
@media (max-width:700px){ html.unten .say{width:auto} html.unten #de{bottom:calc(var(--fb-b) + var(--fb-h) + 7rem)} html.unten .say .s{font-size:1.2rem} }
html.ohneraster #floor{background:none}
/* ?vorschlag: Raster nur im Ueberblick, beim Lesen blendet es aus; EN als zweite Stimme heller; Bildunterschrift einmal in der Leiste; Hinweis zum Start */
html.vorschlag #floor{transition:opacity 1.4s var(--e-out)}
html.vorschlag.lesen #floor{opacity:0}
/* Setzung wie in der 2D-Projektansicht (style.css .proj-bi): DE voll, EN kursiv und blass, Hover ueber EN tauscht die beiden (Ruben 07.11.) */
html.vorschlag .say .s{text-wrap:pretty;-webkit-hyphens:auto;hyphens:auto;hyphenate-limit-chars:8 4 4;overflow-wrap:break-word;transition:color var(--t-fast) var(--e-out)}
html.vorschlag #en .s{font-style:italic;color:var(--ink)}
@media (hover:hover) and (pointer:fine){
  html.vorschlag #en .s{color:rgba(0,0,255,.3)}
  html.vorschlag:has(#en:hover) #en .s{color:var(--ink)}
  html.vorschlag:has(#en:hover) #de .s{color:rgba(0,0,255,.3)}
  html.vorschlag.lesen .say{pointer-events:auto}
}
html.vorschlag .say .c{display:none}
html.vorschlag .card{transition:opacity .8s var(--e-out)}
@keyframes einblenden{from{opacity:0}}
.card.pop{animation:einblenden .9s var(--e-out)}
#hint{display:none}
.say .num{display:none}
/* Vorschlag: Texte in Lesegroesse, mittig zu beiden Seiten der Mittelachse, dezent nummeriert (Ruben 07.11.) */
html.vorschlag .say{width:min(31rem,42vw);background:none;padding:0;margin:0}
html.vorschlag #de{left:auto;right:calc(50% + 1rem)}
html.vorschlag #en{right:auto;left:calc(50% + 1rem)}
html.vorschlag .say .s{font-size:1.1rem;line-height:1.25}
html.vorschlag #en .num{visibility:hidden}   /* Nummer nur einmal, ueber dem deutschen Text */
html.vorschlag .say .num{display:block;color:var(--ink-4);margin-bottom:.35rem;font-variant-numeric:tabular-nums}
html.vorschlag p#hint{display:none}
html.vorschlag:not(.lesen) .say{opacity:0;pointer-events:none}   /* Texte erst nach dem ersten Aufklappen */   /* Hinweis steht im Ueberblick jetzt rechts in der Leiste */
@media (max-width:700px){ html.vorschlag .say{width:auto} html.vorschlag #de{left:var(--pad);right:var(--pad)} html.vorschlag #en{left:var(--pad);right:var(--pad)} }
#ring{display:none;position:absolute;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(0,0,255,.35);transform:rotateX(90deg);pointer-events:none;transition:opacity 1.4s var(--e-out)}
html.kreis #ring{display:block}
html.kreis .card:not(.on) .sh,html.vorschlag .card:not(.on) .sh{opacity:0}
html.kreis.lesen #ring{opacity:.35}
html.vorschlag #hint{display:block;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--fb-b) + var(--fb-h) + 1.4rem);z-index:9;color:var(--ink-4);text-align:center;pointer-events:none;transition:opacity .6s}
html.vorschlag.lesen #hint{opacity:0}
@media (max-width:700px){ html.vorschlag #hint{display:none} }

/* Leiste */
.fbar{position:fixed;left:var(--pad);right:var(--pad);bottom:calc(var(--fb-b) + env(safe-area-inset-bottom,0px));height:var(--fb-h);z-index:12;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 var(--fb-in);border-radius:10em;background:var(--bg);box-shadow:inset 0 0 0 1px var(--ink)}
.fbar .l{justify-self:start}.fbar .c{justify-self:center;display:flex;gap:.6em}.fbar .r{justify-self:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;line-height:1;padding:.3em .8em .26em;border-radius:10em;box-shadow:inset 0 0 0 1px var(--ink);background:var(--bg);color:var(--ink)}
@media (hover:hover){ .pill:hover{background:rgba(0,0,255,.08)} }
.fbar .r{display:flex;align-items:center;gap:.6em}
/* Themenpunkte wie im Gang (corporate/index.html) */
.fdots{display:inline-flex;align-items:center;gap:.2em}
.fdots button{appearance:none;border:0;background:none;padding:.35em .3em;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fdots i{display:block;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--ink);background:transparent;transition:background .3s,transform .3s,box-shadow .3s}
.fdots button.seen i{background:var(--ink)}
.fdots button.cur i{background:var(--ink);transform:scale(1.45);box-shadow:inset 0 0 0 1px var(--ink),0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
@media (hover:hover) and (pointer:fine){ .fdots button:hover i{background:rgba(0,0,255,.35)} .fdots button.seen:hover i,.fdots button.cur:hover i{background:var(--ink)} }
@media (max-width:700px){ .fbar{font-size:13px} .fbar .lg,#cnt{display:none} .fbar .r .pill{padding:.3em .6em .26em} }
</style>
</head>

<script>
// Saetze: bestaetigter Einstieg (Corporate-Geruest 07.11.). EN: Entwurf, ungeprueft.
// Ein Text je Bild (Artefakt Bildtexte Corporate, 07.11.); DE von Ruben freigegeben als Entwurf, EN Entwurf Claude, ungeprueft.
const S=[
 ["Für die Umsetzung unserer Konzepte koordinieren wir die beteiligten Gewerke und übernehmen bei Bedarf die Projektsteuerung. Dazu gehören die Abstimmung mit Behörden und Fachplanung ebenso wie Budget und Ablauf.",
  "To realise our concepts, we coordinate the trades involved and take on project management where needed. This includes coordinating with authorities and specialist planners as well as managing budget and schedule."],
 ["Die Herausforderungen eines Bestands nehmen wir als Ausgangspunkt für den Entwurf. Niedrige Decken, alte Balken oder wenig Tageslicht kaschieren wir nicht, wir machen sie zum Teil der Arbeit.",
  "We take the challenges of an existing building as the starting point for our design. Low ceilings, old beams or little daylight are not concealed; we make them part of the work."],
 ["Wir entwickeln immersive Ausstellungsarchitekturen, die selbst als künstlerische Position gelesen werden können. Freie Projekte und angewandte Auftragsarbeiten gehen in unserer Praxis ineinander über.",
  "We develop immersive exhibition architectures that can themselves be read as an artistic position. In our practice, independent projects and commissioned work merge into one another."],
 ["Wir entwickeln partizipative und soziale Projekte, die Menschen und Communities aktiv einbeziehen. Gesellschaftliche Themen werden dabei zur gelebten Situation, nicht zur illustrierten Botschaft.",
  "We develop participatory and social projects that actively involve people and communities. Social issues become a lived situation rather than an illustrated message."],
 ["Wir arbeiten auch außerhalb der Städte und Institutionen, im ländlichen Raum. Dort machen unsere Interventionen ungenutztes Potenzial sichtbar und schaffen Anlässe für echte Begegnung.",
  "We also work outside cities and institutions, in rural areas. There, our interventions reveal unused potential and create occasions for real encounters."],
 ["Wir beschränken uns nicht auf konventionelle Räume und befragen gern die Grenzen unseres Genres. Ein festes Medium gibt es für uns nicht, was ein Projekt braucht, eignen wir uns an.",
  "We do not limit ourselves to conventional spaces and like to question the boundaries of our genre. We have no fixed medium; we acquire whatever a project needs."],
 ["Wir gestalten temporäre Architekturen und Ausstellungspavillons und können ihre Umsetzung vollständig betreuen. Weil wir lange selbst gebaut haben, kennen wir Material, Konstruktion und Aufwand aus eigener Erfahrung.",
  "We design temporary architecture and exhibition pavilions and can oversee their entire realisation. Having built for many years ourselves, we know materials, construction and effort from our own experience."],
 ["Wir greifen auf, was an einem Ort verhandelt wird, und übersetzen es in eine räumliche Form. Oft ist es eine Behauptung im Raum, die einen vertrauten Ort für eine Zeit anders lesbar macht.",
  "We take up what is being negotiated at a site and translate it into spatial form. Often it is a claim made in space that lets a familiar place be read differently for a while."],
 ["Unsere Arbeiten werden oft zu Bühnen und Displays für andere. Unsere Skulpturen dienen als Plattform für Musik, Performance und zeitgenössische Kunst und treten dabei bewusst in den Hintergrund.",
  "Our works often become stages and displays for others. Our sculptures serve as platforms for music, performance and contemporary art and deliberately step into the background."],
 ["Wir machen sichtbar, was sonst im Hintergrund bleibt, von Technik und Konstruktion bis zu Arbeitsprozessen. Wer sich in unseren Räumen bewegt, ist oft zugleich Akteur*in und Beobachter*in.",
  "We make visible what usually stays in the background, from technology and construction to working processes. Those who move through our spaces are often participants and observers at once."],
 ["Wir befragen die Räume, in denen wir arbeiten, und kehren ihre Logik um. Die sonst zurückhaltende Architektur eines Hauses machen wir selbst zum begehbaren Objekt, das sich mit dem Gebrauch verändert.",
  "We question the spaces we work in and reverse their logic. The otherwise reticent architecture of an institution becomes a walk-in object that changes as it is used."],
 ["Wir schaffen Orte jenseits von Zuhause und Arbeit, die sich Communities aneignen. Viele davon bauen und bespielen wir über Jahre selbst, und sie wirken nach, auch wenn es sie nicht mehr gibt.",
  "We create places beyond home and work that communities make their own. We build and run many of them ourselves for years, and they continue to have an effect even after they are gone."],
 ["Wir entwickeln performative Architekturen für den öffentlichen Stadtraum. Der Prozess ist dabei oft spannender als das Ergebnis, und wer zuschaut, wird selbst zum Teil des Geschehens.",
  "We develop performative architecture for public urban space. The process is often more exciting than the result, and those who watch become part of what happens."],
 ["Wir entwerfen Räume für Wissensvermittlung und außerschulisches Lernen. Vermittelt wird dort durch Gestaltung, in realen statt simulierten Situationen, in denen Forschung sichtbar wird.",
  "We design spaces for knowledge transfer and learning outside school. Here, learning happens through design, in real rather than simulated situations in which research becomes visible."]

];
// Bilder und Filme, Zuordnung zu den Saetzen wie in zeitlos.html
const B='../Bilder/';
// Bilder: Rubens Auswahl im Artefakt Bildwahl Corporate (07.11., zweite Runde), in seiner Reihenfolge. vm = Video vorgemerkt, Foto ist Platzhalter.
// Zuordnung zu den Saetzen vorlaeufig: gleichmaessig verteilt (Ruben ordnet spaeter zu).
const C=[
 {s:0,src:'../Bilder/2026-display/01.webp',c:"Display, 2026"},
 {s:1,src:'../Bilder/2025-bingenheim/hero.webp',c:"Bingenheim, 2025"},
 {s:2,src:'../Bilder/2024-im-angesicht-des-todes/01.webp',c:"Im Angesicht des Todes, 2024",vm:true},
 {s:3,src:'../Bilder/2023-soups/07.webp',c:"Soups, 2023",vm:true},
 {s:4,v:'video.mp4',seg:[15.03,19.95],poster:'',c:"Hole/Mound, 2023"},   // Filmausschnitt 15 bis 20 s
 {s:5,v:'video.mp4',seg:[20.03,24.95],poster:'',c:"Current Tours, 2021"},   // Filmausschnitt 20 bis 25 s
 {s:6,src:'../Bilder/2020-access/01.webp',c:"Access, 2020"},
 {s:7,v:'video.mp4',seg:[25.03,29.95],poster:'',c:"Copy Service, 2019"},   // Filmausschnitt 25 bis 30 s
 {s:8,src:'../Bilder/2018-oper-offenbach/01.webp',c:"Oper Offenbach, 2018"},
 {s:9,src:'../Bilder/2018-insight-out/07.webp',c:"Insight Out, 2018"},
 {s:10,src:'../Bilder/2017-eins-zu-eins/01.webp',c:"Eins zu Eins, 2017"},
 {s:11,src:'../Bilder/2016-kressmann-halle/02.webp',c:"Kressmann-Halle, 2016",sl:[['../Bilder/2012-holzhausenstrasse/01.webp',"Holzhausenstraße, 2012"],['../Bilder/2014-holzhausen/02.webp',"Holzhausen, 2014"]]},   // Slideshow: selbst gebaute Orte (Ruben 07.11.)
 {s:12,v:'video.mp4',seg:[0.03,14.95],poster:'',c:"Transition 1-7, 2024"},   // Filmausschnitt 0 bis 15 s, zwei Szenen (Ruben 07.11.: Schnitte bei 10, 15, 20, 25 s)
 {s:13,src:'../Bilder/2022-forschungswerkstatt/og.jpg',c:"Forschungswerkstatt, 2022"}
];
(function(){
const stack=document.getElementById('stack'), de=document.getElementById('de'), en=document.getElementById('en'), cnt=document.getElementById('cnt');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches, touch=matchMedia('(hover:none)').matches;
const ROT=-90;   // Ruhelage: Bilder quer zum Band (Ruben 07.11.)
// Ansicht (Ruben 07.11.): Perspektive, Raster 45 Grad (Isometrie verworfen).
// Zum Vergleich: ?iso = isometrisch, ?raster=20 andere Drehung, ?mix = Bild dreht nur 45 Grad
const Q=new URLSearchParams(location.search), MIX=Q.has('mix'), VOR=Q.has('vorschlag')||Q.has('kreis');
const KREIS=Q.has('kreis');   // ?kreis: Stapel als Ring, von aussen gedreht (Gegenstueck zum 3D-Walk, Ruben 07.11.)
if(KREIS){ Q.set('vorschlag',''); document.documentElement.classList.add('kreis'); }
if(VOR||KREIS){ Q.set('schwenk',''); Q.set('unten',''); document.documentElement.classList.add('vorschlag'); }   // Vorschlag Claude 07.11.
document.documentElement.classList.toggle('unten',Q.has('unten')); document.documentElement.classList.toggle('ohneraster',Q.has('ohneraster'));
const _q=0, ISO=Q.has('iso');
const RASTER=MIX?45:(Q.has('raster')?+Q.get('raster'):45);
const TURN=MIX?-45:0;    // 0 = gewaehltes Bild liegt parallel zu den Querlinien des Rasters
const ISO_S=.6;   // Massstab der Isometrie
if(ISO){ document.getElementById('scene').style.perspective='none';
  document.getElementById('rig').style.transform='scale('+ISO_S+') rotateX(-35.264deg) rotateY('+RASTER+'deg)'; document.getElementById('rig').style.top='52%'; }   // echte Isometrie: arctan(1/Wurzel 2)
else document.getElementById('rig').style.transform='translateZ(-700px) rotateX(-18deg) rotateY('+RASTER+'deg)';
// ?schwenk: geschlossen 45 Grad (Ueberblick), beim Aufklappen schwenkt der Raum auf 0 Grad (Bild frontal), beim Schliessen zurueck
const SCHWENK=Q.has('schwenk'); let rigR=RASTER;
// Kamera auf normaler Hoehe (Ruben 07.11.): keine Neigung, Senkrechte bleiben senkrecht; ?tilt=-18 = alte Aufsicht
const TILT=Q.has('tilt')?+Q.get('tilt'):0; let tiltNow=VOR?-12:TILT;   // Vorschlag: im Ueberblick leicht von oben, beim Lesen auf Augenhoehe
if(SCHWENK) document.getElementById('scene').style.perspectiveOrigin='50% '+(Q.has('auge')?Q.get('auge'):'50')+'%';
const EDGE=1;    // gedrehtes Bild rueckt an die rechte Kante des Stapels (Ruben 07.11.); -1 = linke Kante
function stackW(){ let m=0; C.forEach(c=>{ if(c.w>m) m=c.w; }); return m; }
const H=Math.round(Math.min(innerHeight*(VOR?.6:.46),VOR?640:460)), G=Math.round(H*.14);   // Vorschlag: groesser, weil das Bild hoeher sitzt (Ruben 07.11.)
const MY=VOR?.41:.5;   // senkrechte Lage der Bildmitte (Vorschlag hoeher, damit unten Platz fuer Text bleibt)   // G = Abstand im geschlossenen Stapel
document.documentElement.style.setProperty("--h",H+"px");

const els=C.map((c,i)=>{
  const a=document.createElement("div"); a.className="card";
  a.innerHTML="<span class=\"sh\"></span><span class=\"pic\">"+(c.v
    ? "<video muted loop playsinline preload=\"metadata\" poster=\""+c.poster+"\" src=\""+c.v+"\"></video>"
    : "<img alt=\"\" decoding=\"async\" src=\""+c.src+"\">")+(c.sl?c.sl.map(x=>"<img class=\"sl\" alt=\"\" decoding=\"async\" src=\""+x[0]+"\">").join(""):"")+(c.vm?"<span class=\"vtag\">Video</span>":"")+"</span>";   // vm: Video vorgemerkt, Foto ist Platzhalter
  stack.appendChild(a);
  c.w=H*(c.v?16/9:1.5); c.x=0; c.t=0; c.r=ROT; c.z=0;
  const m=a.querySelector("img,video"), pic=a.querySelector(".pic"), sh=a.querySelector(".sh");
  const place=()=>{ pic.style.left=(-c.w/2)+"px"; sh.style.left=(-c.w*.58)+"px"; sh.style.width=(c.w*1.16)+"px"; };   // Drehpunkt in der Bildmitte
  const setW=()=>{ const w=m.naturalWidth||m.videoWidth, h=m.naturalHeight||m.videoHeight; if(w&&h) c.w=H*w/h; place(); };
  if(c.seg&&m.tagName==="VIDEO"){ m.removeAttribute("loop"); m.addEventListener("loadedmetadata",()=>{ m.currentTime=c.seg[0]; }); m.addEventListener("timeupdate",()=>{ if(m.currentTime>=c.seg[1]||m.currentTime<c.seg[0]-.2) m.currentTime=c.seg[0]; }); m.preload="auto"; }
  m.addEventListener("load",setW); m.addEventListener("loadedmetadata",setW); if(m.complete) setW(); place();
  return a;
});

// Lage: geschlossener Stapel um die Mitte. Karte i steht vor Karte i+1 (vorne links, hinten rechts).
let hov=-1, anchor=null, rigTop=null;
const RISE=Q.has('rise')?+Q.get('rise'):.12;
const DIST=Q.has('dist')?+Q.get('dist'):1400; let distNow=VOR?-DIST:-700;   // Steigung der Staffelung im Ueberblick, wie bei der Vorlage (Ruben 07.11.)
const GC=VOR?Math.round(Q.has('gc')?H*+Q.get('gc'):H*.42):G;   // Vorschlag: geschlossener Stapel ueber die ganze Diagonale, vorderstes Bild angeschnitten (Ruben 07.11.)   // geschlossener Stapel: bei vielen Bildern enger, damit er ins Bild passt
const base=i=>(i-(C.length-1)/2)*GC;
C.forEach((c,i)=>{ c.x=c.t=base(i); });
function gaps(){
  // Abstand von Karte i zu i+1: um das gedrehte Bild herum so viel Platz, wie es entlang des Bands braucht
  const half=hov<0?0:C[hov].w*.5*Math.abs(Math.cos(TURN*Math.PI/180))+H*.08;
  return C.map((c,i)=>{
    if(i===C.length-1) return 0;
    if(hov<0) return G;
    if(i===hov-1||i===hov) return G+half;
    const d=i<hov ? hov-1-i : i-hov;                         // Nachbarn ruecken etwas mit, nach aussen weniger
    return G*(1+.9*Math.exp(-(d*d)/3));
  });
}
// Endlos (Vorschlag, Ruben 07.11.): Lage relativ zum gewaehlten Bild, nach dem letzten kommt wieder das erste.
// Durchgeblaetterte Bilder werden hinten unsichtbar wieder angelegt (Versatz o, -4..4 bei 9 Bildern).
function off(i){ const N=C.length; let o=((i-hov)%N+N)%N; if(o>Math.floor(N/2)) o-=N; return o; }
function layoutLoop(){
  const N=C.length, half=C[hov].w*.5*Math.abs(Math.cos(TURN*Math.PI/180))+H*.08;
  const gap=o=>{ if(o===0||o===-1) return G+half; const d=o>0?o:-o-1; return d>=2?G*1.9:G*(1+.9*Math.exp(-(d*d)/3)); };   // ab dem dritten Nachbarn weiter auseinander, damit die blassen Bilder sichtbar werden   // Abstand zwischen Versatz o und o+1
  const by={}; C.forEach((c,i)=>{ const o=off(i); if((c.o!==undefined&&Math.abs(o-c.o)>N/2)||(c.o===undefined&&o<0)) c.jump=true; c.o=o; by[o]=c; });
  C[hov].t=anchor;
  for(let o=1;by[o];o++) by[o].t=by[o-1].t+gap(o-1);
  for(let o=-1;by[o];o--) by[o].t=by[o+1].t-gap(o);
}
function layout(){
  if(VOR&&hov>=0){ layoutLoop(); return; }
  C.forEach(c=>{ c.o=undefined; });
  const g=gaps();
  if(hov<0){ C.forEach((c,i)=>{ c.t=base(i); }); return; }
  C[hov].t=anchor;
  for(let i=hov+1;i<C.length;i++) C[i].t=C[i-1].t+g[i-1];
  for(let i=hov-1;i>=0;i--) C[i].t=C[i+1].t-g[i];
}
// Ring: Karte i steht auf Winkel i*DA + ringRot; in Ruhe radial (wie ein Rolodex), die gewaehlte dreht nach aussen und tritt vor
const DA=360/C.length; let ringRot=DA/2, kTilt=-24, kDist=-2500;   // Start halb versetzt, damit vorne keine Karte genau auf der Kante steht
function kreisTick(){
  const k=reduce?1:.06, R=stackW()*.62+H*.25, rig=document.getElementById("rig"), ring=document.getElementById("ring");
  if(hov>=0){ let t=-hov*DA; while(t-ringRot>180) t-=360; while(t-ringRot<-180) t+=360; ringRot+=(t-ringRot)*k; }
  kTilt+=((hov<0?-24:-6)-kTilt)*(reduce?1:.045); kDist+=((hov<0?-2500:-900)-kDist)*(reduce?1:.045);   // Ueberblick weiter weg und von oben, Lesen nah und auf Augenhoehe
  ring.style.left=ring.style.top=(-R)+"px"; ring.style.width=ring.style.height=(2*R)+"px";
  if(rigTop===null) rigTop=rig.getBoundingClientRect().top;
  rig.style.transform="translateZ("+kDist.toFixed(1)+"px) rotateX("+kTilt.toFixed(2)+"deg)";
  C.forEach((c,i)=>{
    c.b=(c.b===undefined?1:c.b); c.b+=((i===hov?0:1)-c.b)*k;          // 1 = radial, 0 = nach aussen gedreht
    const th=i*DA+ringRot, rr=R+(1-c.b)*H*.55, a=th*Math.PI/180;
    els[i].style.transform="translate3d("+(rr*Math.sin(a)).toFixed(1)+"px,0,"+(rr*Math.cos(a)).toFixed(1)+"px) rotateY("+(th+90*c.b).toFixed(2)+"deg)";
    els[i].style.opacity=(hov<0?1:(.25+.75*(Math.cos(a)+1)/2)).toFixed(2);
  });
  if(hov>=0){ const r=els[hov].querySelector(".pic").getBoundingClientRect(); rigTop-=((r.top+r.height/2)-innerHeight*MY)*(reduce?1:.06); }
  else rigTop+=(innerHeight*.6-rigTop)*(reduce?1:.05);
  rig.style.top=rigTop.toFixed(1)+"px";
}
let slideK=0, slideFor=-1;
setInterval(()=>{ if(slideFor!==hov) document.querySelectorAll(".sl.cur").forEach(x=>x.classList.remove("cur"));
  if(hov<0||!C[hov].sl){ slideFor=-1; return; } const c=C[hov], imgs=els[hov].querySelectorAll(".sl");
  if(slideFor!==hov){ slideFor=hov; slideK=0; return; }
  slideK=(slideK+1)%(c.sl.length+1); imgs.forEach((im,j)=>im.classList.toggle("cur",j===slideK-1));
  cnt.textContent=VOR?(slideK?c.sl[slideK-1][1]:c.c):cnt.textContent; },3500);   // Slideshow alle 3,5 s, Leiste nennt das jeweilige Projekt
function segGuard(){ if(hov<0||!C[hov].seg) return; const v=els[hov].querySelector("video"); if(v&&(v.currentTime>=C[hov].seg[1]||v.currentTime<C[hov].seg[0]-.3)) v.currentTime=C[hov].seg[0]; }
function tick(){
  segGuard();
  if(KREIS){ kreisTick(); requestAnimationFrame(tick); return; }
  layout();
  const k=reduce?1:.07;   // ruhige Fahrt
  if(SCHWENK){ rigR+=((hov<0?45:0)-rigR)*(reduce?1:.045); tiltNow+=(((VOR&&hov<0)?-12:TILT)-tiltNow)*(reduce?1:.045); distNow+=(((VOR&&hov<0)?-DIST:-700)-distNow)*(reduce?1:.045);   // Ueberblick weiter weg, damit die steile Staffelung ins Bild passt
    document.getElementById('rig').style.transform='translateZ('+distNow.toFixed(1)+'px) rotateX('+tiltNow.toFixed(2)+'deg) rotateY('+rigR.toFixed(2)+'deg)'; }
  if(VOR) C.forEach((c,i)=>{ const d=hov<0?0:Math.abs(c.o); els[i].style.opacity=d<=2?1:(d===3?.5:(d===4?.22:0)); });   // je Seite zwei volle, dann zwei blasse Bilder (Ruben 07.11.)
  C.forEach((c,i)=>{ if(c.jump){ c.x=c.t; c.jump=false; els[i].classList.remove('pop'); void els[i].offsetWidth; els[i].classList.add('pop'); } });   // unsichtbar ans andere Ende springen
  // aeussere Bilder nach hinten versetzen: kleiner, mehr Tiefe
  C.forEach(c=>{ const d=(VOR&&hov>=0&&c.o!==undefined)?Math.abs(c.o):0; c.dp=0; c.sc=(c.sc||1)+((d>=3?1-.16*(d-2):1)-(c.sc||1))*k; });   // aeussere Bilder kleiner
  C.forEach((c,i)=>{ c.x+=(c.t-c.x)*k; c.r+=((i===hov?TURN:ROT)-c.r)*k; c.z+=((i===hov?EDGE*(stackW()/2+H*.06):0)-c.z)*k;
    c.yy=(c.yy||0)+(((VOR&&hov<0)?-(i-(C.length-1)/2)*H*RISE:0)-(c.yy||0))*k;   // Ueberblick: Stapel steigt nach hinten an
    els[i].style.transform="translate3d("+c.x.toFixed(1)+"px,"+c.yy.toFixed(1)+"px,"+(c.z-(c.o!==undefined?c.o:i)*2+(c.dp||0)).toFixed(1)+"px) rotateY("+c.r.toFixed(2)+"deg) scale("+(c.sc||1).toFixed(3)+")"; });
  // gewaehltes Bild in die Bildmitte: der ganze Stapel schiebt sich nach, bis es mittig steht
  // gewaehltes Bild auf 50 % / 50 % (Ruben 07.11.): waagerecht schiebt sich der Stapel, senkrecht der ganze Raum
  const rig=document.getElementById("rig");
  if(rigTop===null) rigTop=rig.getBoundingClientRect().top;
  if(hov>=0){ const r=els[hov].querySelector(".pic").getBoundingClientRect();
    anchor-=((r.left+r.width/2)-innerWidth/2)*(reduce?1:.06);
    // bei niedrigen Fenstern rueckt das Bild hoeher, damit die Texte ueber der Leiste Platz haben
    let cy=innerHeight*MY, lim=innerHeight; if(VOR&&innerWidth>700){ const th=Math.max(de.offsetHeight,en.offsetHeight); lim=document.querySelector(".fbar").getBoundingClientRect().top-20-th; cy=Math.min(cy,lim-36-r.height/2); }
    rigTop-=((r.top+r.height/2)-cy)*(reduce?1:.06);
    // Vorschlag: Texte beziehen sich auf das Bild, DE an der linken, EN an der rechten Bildkante (Ruben 07.11.)
    if(VOR&&innerWidth>700){ const half=Math.max(160,r.width/2-14); de.style.left=r.left.toFixed(1)+"px"; de.style.right="auto"; de.style.width=half.toFixed(1)+"px";
      en.style.left=(r.right-half).toFixed(1)+"px"; en.style.right="auto"; en.style.width=half.toFixed(1)+"px";
      const top=Math.min(r.bottom+36,lim)+"px"; de.style.top=en.style.top=top; de.style.bottom=en.style.bottom="auto"; } }   // beide Texte haengen gleich hoch unter dem Bild
  else { rigTop+=(innerHeight*(ISO?.52:.66)-rigTop)*(reduce?1:.05);
    if(VOR&&de.style.width){ de.style.left=de.style.right=de.style.width=de.style.top=de.style.bottom=""; en.style.left=en.style.right=en.style.width=en.style.top=en.style.bottom=""; } }
  rig.style.top=rigTop.toFixed(1)+"px";
  requestAnimationFrame(tick);
}

// Text
let curS=-1;
function say(s,cap){
  if(s!==curS){ curS=s; [de,en].forEach(el=>{ el.classList.add('out'); }); setTimeout(()=>{ de.querySelector('.s').textContent=S[s][0]; en.querySelector('.s').textContent=S[s][1]; num(s); de.classList.remove('out'); en.classList.remove('out'); }, reduce?0:180); }
  de.querySelector('.c').textContent=cap; en.querySelector('.c').textContent=cap;
}
function pick(i){
  if(i===hov) return;
  if(hov>=0){ const v=els[hov].querySelector('video'); if(v) v.pause(); els[hov].classList.remove('on'); }
  anchor=C[i].x; hov=i; els[i].classList.add('on');
  const v=els[i].querySelector('video'); if(v) v.play().catch(()=>{});
  say(C[i].s,C[i].c); dots(C[i].s);
  cnt.textContent=VOR?C[i].c:String(i+1).padStart(2,'0')+' / '+String(C.length).padStart(2,'0');   // Vorschlag: Nummer steht schon ueber dem Text
  document.documentElement.classList.add('lesen');
}
function release(){
  if(hov>=0){ const v=els[hov].querySelector('video'); if(v) v.pause(); els[hov].classList.remove('on'); }
  hov=-1; anchor=null; cnt.textContent=VOR?HINT:''; document.documentElement.classList.remove('lesen');
}
// Steuerung in Schritten (Ruben 07.11.: Mausregler war zu unruhig). Eine Geste = ein Bild, danach steht alles still.
const sc=document.getElementById('scene'); let rt=null;
function step(d){ if(KREIS||VOR){ pick(hov<0?0:(hov+d+C.length)%C.length); return; }   // Ring: endlos weiterdrehen, Esc schliesst
  if(hov===0&&d<0){ release(); return; } pick(Math.max(0,Math.min(C.length-1,hov+d))); }
let wAcc=0, wLock=false, wT=null;
addEventListener('wheel',e=>{ e.preventDefault(); clearTimeout(wT); wT=setTimeout(()=>{ wLock=false; wAcc=0; },240);
  if(wLock) return; wAcc+=e.deltaY+e.deltaX; if(Math.abs(wAcc)>40){ step(wAcc>0?1:-1); wLock=true; } },{passive:false});
let px=null;
sc.addEventListener('pointerdown',e=>{ px=e.clientX; });
addEventListener('pointerup',e=>{ if(px===null) return; const d=e.clientX-px; px=null; if(Math.abs(d)>40) step(d<0?1:-1); });
els.forEach((a,i)=>{ a.addEventListener('click',()=>pick(i)); });
addEventListener('keydown',e=>{ if(e.key==='ArrowRight') step(1); if(e.key==='ArrowLeft') step(-1); if(e.key==='Escape') release(); if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' ') step(1); if(e.key==='ArrowUp'||e.key==='PageUp') step(-1); });

// Themenpunkte: ein Punkt pro Satz, Klick faechert den Stapel bei diesem Thema auf
const fd=document.getElementById('fdots');
const db=S.map((s,k)=>{ const b=document.createElement('button'); b.type='button'; b.title=(k+1)+' · '+s[0]; b.setAttribute('aria-label',b.title); b.innerHTML='<i></i>';
  b.onclick=()=>{ clearTimeout(rt); pick(C.findIndex(c=>c.s===k)); }; fd.appendChild(b); return b; });
function dots(k){ db.forEach((b,j)=>{ b.classList.toggle('cur',j===k); if(j===k){ b.classList.add('seen'); b.setAttribute('aria-current','step'); } else b.removeAttribute('aria-current'); }); }
dots(0);

// zu Beginn steht der erste Satz
const HINT="Scrollen, um aufzuklappen / Scroll to open"; if(VOR) cnt.textContent=HINT;
function num(k){ const t=String(k+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0'); de.querySelector('.num').textContent=t; en.querySelector('.num').textContent=t; }
de.querySelector('.s').textContent=S[0][0]; en.querySelector('.s').textContent=S[0][1]; num(0); curS=0;
document.getElementById('scene').style.pointerEvents='auto';
// Start: Stapel geschlossen, erst der erste Schritt dreht ein Bild (Ruben 07.11.)
requestAnimationFrame(tick);
})();
</script>
</body>
